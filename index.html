<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe8ef" id="themeColor"><meta name="description" content="Two of Us – kleine Spiele für euch zwei.">
<link rel="manifest" href="manifest.webmanifest"><title>Two of Us ♡</title>
<style>
:root{--bg:#fff0f3;--paper:#fff9fa;--ink:#542637;--muted:#986f7d;--pink:#f5a8bb;--pink2:#fbd1dc;--line:#f3bdca;--shadow:0 12px 28px #9e52651c;--accent:#d85c7d;--cloud:#fffafd}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;transition:background .25s,color .25s}
body.dark{--bg:#271b2a;--paper:#3a2939;--ink:#fff0f5;--muted:#d2aebb;--pink:#75445d;--pink2:#58364d;--line:#70465c;--shadow:0 12px 30px #10081070;--accent:#ff9fbd;--cloud:#493348}
button{font:inherit;cursor:pointer;border:0;color:inherit}.app{width:min(100%,480px);min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--paper));padding-bottom:34px;box-shadow:0 0 50px #6b32400d}
.top{height:70px;padding:20px 22px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}.brand{font-family:Georgia,serif;font-style:italic;font-size:25px;font-weight:bold;letter-spacing:-1px}.brand span{color:var(--accent)}.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:19px;box-shadow:var(--shadow)}
.screen{position:relative;z-index:1;padding:18px 22px 30px}.screen.hidden{display:none}.intro{text-align:center;padding-top:20px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:850;margin:0 0 12px}.headline{font-family:Georgia,serif;font-style:italic;font-size:34px;line-height:1.12;margin:0 0 10px;letter-spacing:-.8px}.subtitle{color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto 26px;max-width:300px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 20px}.player{background:var(--paper);border:1.5px solid var(--line);border-radius:25px;padding:14px 8px 13px;box-shadow:var(--shadow);transition:transform .16s,border-color .16s}.player:active,.together:active,.mode:active{transform:scale(.98)}.player.selected{border:2px solid var(--accent);background:var(--pink2)}.avatar{width:116px;height:116px;max-width:100%;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 5px 14px #6e33401e}.player-name{display:block;font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:21px;margin:9px 0 0}.together{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,290px);margin:0 auto;background:linear-gradient(120deg,var(--pink2),var(--paper));border:1.5px solid var(--line);border-radius:24px;padding:15px 18px;box-shadow:var(--shadow);font-weight:850;font-size:15px}.together .symbol{font-size:25px;color:var(--accent)}.footnote{text-align:center;font-size:11px;color:var(--muted);margin:16px 0 0}
.mode-head{text-align:center;padding-top:12px}.mode-head .headline{font-size:32px}.active-player{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:30px;background:var(--paper);padding:7px 12px;font-size:12px;color:var(--muted);margin:0 0 24px}.active-player strong{color:var(--ink)}.mode-list{display:grid;gap:13px}.mode{width:100%;display:flex;align-items:center;gap:15px;text-align:left;padding:15px 16px;border-radius:22px;background:var(--paper);border:1.5px solid var(--line);box-shadow:var(--shadow);min-height:91px;transition:transform .15s}.mode-icon{width:54px;height:54px;flex:0 0 54px;border-radius:18px;display:grid;place-items:center;font-size:27px;background:var(--pink2);color:var(--accent)}.mode-copy{flex:1}.mode-copy strong{font-size:16px;display:block;margin-bottom:4px}.mode-copy small{font-size:12px;color:var(--muted)}.chevron{font-size:24px;color:var(--accent)}.bottom-art{position:relative;height:82px;margin:22px -22px -30px;overflow:hidden;pointer-events:none}.bottom-art:before,.bottom-art:after{content:"";position:absolute;bottom:-44px;width:190px;height:95px;background:var(--pink2);opacity:.72;border-radius:50%}.bottom-art:before{left:-75px}.bottom-art:after{right:-75px}.heart-line{position:absolute;left:-5%;right:-5%;bottom:4px;width:110%;height:54px;overflow:visible}.heart-line path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round;opacity:.85;stroke-dasharray:600;stroke-dashoffset:0;animation:draw 9s ease-in-out infinite alternate}.heart-line text{fill:var(--accent);font-size:35px;animation:float 4s ease-in-out infinite}@keyframes draw{from{stroke-dashoffset:180}to{stroke-dashoffset:0}}@keyframes float{50%{transform:translateY(-5px)}}
.toast{position:fixed;z-index:10;bottom:22px;left:50%;transform:translateX(-50%);background:#542637;color:#fff;padding:11px 16px;border-radius:30px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.toast.show{opacity:1}.settings{display:flex;justify-content:center;margin-top:18px}.text-btn{background:transparent;color:var(--accent);font-size:12px;font-weight:800;padding:9px}.back{background:transparent;color:var(--accent);font-weight:800;padding:8px 0;margin-bottom:8px}
@media(max-height:700px){.intro{padding-top:5px}.subtitle{margin-bottom:16px}.players{margin:14px 0}.avatar{width:96px;height:96px}.bottom-art{height:65px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Two of Us <span>♡</span></div><button class="icon-btn" id="themeBtn" aria-label="Nachtmodus umschalten">☾</button></header>
<section class="screen intro" id="welcome">
<p class="eyebrow">Euer kleines Wir</p><h1 class="headline">Hallo ihr Lieben!<br>Wer spielt gerade?</h1><p class="subtitle">Wählt aus, wer heute dabei ist. Wir merken uns eure Auswahl auf diesem Handy.</p>
<div class="players">
<button class="player" data-player="Alina"><img class="avatar" src="alina-avatar.png" alt="Alinas Cartoon-Avatar"><span class="player-name">Alina</span></button>
<button class="player" data-player="Nikita"><img class="avatar" src="nikita-avatar.png" alt="Nikitas Cartoon-Avatar"><span class="player-name">Nikita</span></button>
</div>
<button class="together" data-player="Zusammen"><span class="symbol">♡</span><span>Gemeinsamer Modus</span><span class="symbol">♡</span></button>
<p class="footnote">Ein Handy, zwei Menschen und ganz viel gemeinsame Zeit.</p>
<div class="bottom-art"><svg class="heart-line" viewBox="0 0 420 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C55 15 75 58 130 38 C165 25 175 17 195 34 C205 44 208 49 210 49 C212 49 215 44 225 34 C245 17 255 25 290 38 C345 58 365 15 420 40"/><text x="190" y="43">♡</text></svg></div>
</section>
<section class="screen hidden" id="modes">
<button class="back" id="changeProfile">← Profil wechseln</button><div class="mode-head"><p class="eyebrow">Schön, dass ihr da seid</p><h1 class="headline">Eure Spielmodi ♡</h1><p class="subtitle">Worauf habt ihr heute Lust?</p><div class="active-player" id="activePlayer">♡ <strong>Alina</strong></div></div>
<div class="mode-list">
<button class="mode" data-mode="quiz"><span class="mode-icon">🏆</span><span class="mode-copy"><strong>Quizduell</strong><small>Allgemeinwissen & Fragen gegeneinander</small></span><span class="chevron">›</span></button>
<button class="mode" data-mode="know"><span class="mode-icon">♡</span><span class="mode-copy"><strong>Wer kennt wen besser?</strong><small>Findet heraus, wer besser aufgepasst hat</small></span><span class="chevron">›</span></button>
<button class="mode" data-mode="likely"><span class="mode-icon">⇄</span><span class="mode-copy"><strong>Wer würde eher?</strong><small>Vergleicht eure spontanen Entscheidungen</small></span><span class="chevron">›</span></button>
<button class="mode" data-mode="couple"><span class="mode-icon">💕</span><span class="mode-copy"><strong>Couple Questions</strong><small>Lustige, persönliche & tiefere Fragen</small></span><span class="chevron">›</span></button>
</div>
<div class="bottom-art"><svg class="heart-line" viewBox="0 0 420 60" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C55 15 75 58 130 38 C165 25 175 17 195 34 C205 44 208 49 210 49 C212 49 215 44 225 34 C245 17 255 25 290 38 C345 58 365 15 420 40"/><text x="190" y="43">♡</text></svg></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div></div>
<script>
(()=>{
const KEY='twoOfUsDeviceProfileV1';const welcome=document.getElementById('welcome');const modes=document.getElementById('modes');const active=document.getElementById('activePlayer');const toast=document.getElementById('toast');let current=localStorage.getItem(KEY)||'';let toastTimer;
function showModes(){welcome.classList.add('hidden');modes.classList.remove('hidden');active.innerHTML='♡ <strong></strong>';active.querySelector('strong').textContent=current||'Zusammen';}
function showWelcome(){modes.classList.add('hidden');welcome.classList.remove('hidden');document.querySelectorAll('.player').forEach(b=>b.classList.toggle('selected',b.dataset.player===current));}
function choose(name){current=name;localStorage.setItem(KEY,name);showModes();}
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600);}
document.querySelectorAll('[data-player]').forEach(btn=>btn.addEventListener('click',()=>choose(btn.dataset.player)));
document.getElementById('changeProfile').addEventListener('click',showWelcome);
document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{const names={quiz:'Quizduell',know:'Wer kennt wen besser?',likely:'Wer würde eher?',couple:'Couple Questions'};notify(names[btn.dataset.mode]+' kommt als Nächstes 💗');}));
const themeBtn=document.getElementById('themeBtn');function setTheme(dark){document.body.classList.toggle('dark',dark);themeBtn.textContent=dark?'☀':'☾';document.getElementById('themeColor').content=dark?'#271b2a':'#ffe8ef';localStorage.setItem('twoOfUsTheme',dark?'dark':'light');}themeBtn.addEventListener('click',()=>setTheme(!document.body.classList.contains('dark')));setTheme(localStorage.getItem('twoOfUsTheme')==='dark');
if(current){showModes();}else{showWelcome();}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
